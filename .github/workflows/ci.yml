name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The unit-tested core only needs numpy; skip the heavy CV/ML stack (torch) in CI.
      - name: Install
        run: |
          pip install --no-deps -e .
          pip install numpy pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
